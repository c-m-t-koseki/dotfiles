# Don't lose ENV
set -g update-environment 'ITERM_PROFILE'

# C-s is my Prefix Key
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# reload tmux.conf
# bind r source-file ~/.tmux.conf \; display "Reloaded!"
bind r source-file ~/.tmux.conf

set -g escape-time 0
set -g base-index 1
setw -g pane-base-index 1

set -g status-interval 3
## Visual Notification
setw -g monitor-activity off
set -g visual-activity off


set -g default-terminal "screen-256color"

# Pane Border
set -g pane-border-fg colour233
set -g pane-border-bg colour233

# Active Pane
set -g pane-active-border-fg blue
set -g pane-active-border-bg blue

# Status bar
set -g status-position top
## Color
set -g status-fg default
set -g status-bg default

# CommandLine Color
set -g message-fg default
set -g message-bg default
set -g message-attr bright

## Left panel
set -g status-left-length 40
set -g status-left '#H'
set -g status-left-fg colour240

## WindowList
setw -g status-justify centre
setw -g window-status-bg default
setw -g window-status-fg colour242
setw -g window-status-attr dim
setw -g window-status-format '#I:#W'
### Active Window
setw -g window-status-current-bg colour234
setw -g window-status-current-attr bold
setw -g window-status-current-format '\
#[fg=colour110]#I:#[fg=colour252]#W\
'

## Right panel
set -g status-right "#[bold,fg=black,bg=white][%m-%d(%a) %H:%M]"

# tpm plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# tmux-pain-control
set -g @pane_resize "6"
# tmux-yunk
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
# tmux-resurrect
# set -g @resurrect-strategy-vim 'session'

run '~/.tmux/plugins/tpm/tpm'
