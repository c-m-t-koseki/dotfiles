# Don't lose ENV
set -g update-environment 'ITERM_PROFILE'

# C-s is my Prefix Key
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# reload tmux.conf
bind r source-file ~/.tmux.conf

set -g escape-time 0
set -g base-index 1
setw -g pane-base-index 1

set -g status-interval 0
## Visual Notification
setw -g monitor-activity off
set -g visual-activity off


set -g default-terminal "$TERM"
# set -ga terminal-overrides ",$TERM:Tc"

# Pane Border
set -g pane-border-style        bg=colour234,fg=colour234
set -g pane-active-border-style bg=#367cda,fg=#367cda
# set -g pane-border-status bottom
# set -g pane-border-format '#(tmux-pane-border "#{pane_active}" "#{pane_current_path}" "#{pane_current_command}" "#{pane_pid}")'

# Status bar
set -g status-position top
## Color
set -g status-style fg=default,bg=default

# CommandLine Color
set -g message-style fg=default,bg=default,bright

## Left panel
set -g status-left-length 40
set -g status-left '#H'
set -g status-left-style fg=colour240

## WindowList
setw -g status-justify centre
setw -g window-status-style bg=default,fg=colour242,dim
setw -g window-status-format '#I:#W'
### Active Window
setw -g window-status-current-style bg=colour234,bold
setw -g window-status-current-format '#[fg=colour110]#I:#[fg=colour252]#W'

## Right panel
set -g status-right "#[bold,fg=black,bg=white] \uf073 %m/%d(%a) \uf64f %H:%M "

# tpm plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @plugin 'tmux-plugins/tmux-resurrect'

# tmux-pain-control
set -g @pane_resize "6"
# tmux-yunk
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
# tmux-resurrect
# set -g @resurrect-strategy-vim 'session'

bind S set-window-option synchronize-panes

run '~/.tmux/plugins/tpm/tpm'
